<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Registro de emergência — PULLMED</title>

<style>
/* ==================================================================
   PULLMED — registro de emergência

   Lido por um socorrista: com pressa, possivelmente de luva, sob luz
   ruim, num aparelho que não é dele.

   Três decisões deliberadas:

   1. ZERO fontes externas. A dependência de rede é a fragilidade
      conhecida deste sistema. Buscar fonte num servidor remoto, numa
      ambulância em área de sombra, adiciona um ponto de falha ao que
      já é o elo fraco. Pilha do sistema, e só.

   2. Ordem por IMPACTO NA DECISÃO, não por ordem do banco:
      alergia → medicação → dispositivo → condição. É a ordem da triagem.

   3. NENHUMA inferência sobre texto livre. Não marcamos "anticoagulado"
      por palavra-chave: falharia em "Marevan" ou "Xarelto" e criaria
      falsa tranquilidade. Hierarquia e tamanho fazem o trabalho; a
      leitura é do clínico.
   ================================================================== */

:root {
  --paper:      #FBFBF9;
  --ink:        #14181C;
  --muted:      #5A6975;
  --rule:       #D5DBDF;
  --calm:       #14405C;   /* azul clínico, Estrela da Vida */
  --alert:      #C4161C;   /* vermelho de emergência */
  --alert-bg:   #FCF0F0;

  --step--1: 0.8125rem;
  --step-0:  1.0625rem;
  --step-1:  1.375rem;
  --step-2:  1.875rem;
  --step-3:  2.625rem;
  --step-4:  5.5rem;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.45;
  padding-bottom: env(safe-area-inset-bottom);
}

.wrap { max-width: 44rem; margin: 0 auto; }

/* ---- barra superior ---------------------------------------------- */
.bar {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.7rem 1.15rem;
  background: var(--calm);
  color: #fff;
}
.bar b {
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.bar span {
  font-size: var(--step--1);
  opacity: 0.75;
}

/* ---- procedência: o aviso mais importante da página --------------- */
/* Estes dados foram inseridos pelo paciente. Não são verificados por
   clínico algum. Essa é a única coisa sempre verdadeira aqui, e por
   isso ela vem antes de qualquer dado. */
.provenance {
  background: var(--alert-bg);
  border-bottom: 2px solid var(--alert);
  color: var(--alert);
  padding: 0.7rem 1.15rem;
  font-size: var(--step--1);
  font-weight: 600;
  line-height: 1.35;
}

/* ---- canhoto de triagem: o elemento de assinatura ----------------- */
/* O tipo sanguíneo é o fato mais escaneável de todos, e a ficha de
   triagem física tem um canhoto destacável. O picote é literal. */
.stub {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: stretch;
  border-bottom: 1px solid var(--rule);
}
.blood {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 1.1rem 1.4rem 1.3rem;
  border-right: 2px dashed var(--rule);
  background: #fff;
}
.blood dt {
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.blood dd {
  font-size: var(--step-4);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--calm);
}
.who {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1.1rem 1.15rem;
  min-width: 0;
}
.who h1 {
  font-size: var(--step-2);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.015em;
  overflow-wrap: anywhere;
}
.who p {
  margin-top: 0.25rem;
  color: var(--muted);
  font-size: var(--step-0);
}

/* ---- campos, em ordem de triagem ---------------------------------- */
.field {
  padding: 0.95rem 1.15rem;
  border-bottom: 1px solid var(--rule);
}
.field h2 {
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.2rem;
}
.field p {
  font-size: var(--step-1);
  line-height: 1.35;
  overflow-wrap: anywhere;
}
/* Os três primeiros campos são os que mudam conduta nos dez primeiros
   minutos. Recebem peso tipográfico maior, não cor: cor gritada em tudo
   deixa de significar alguma coisa. */
.field.critical p { font-weight: 650; }
.field.critical h2 { color: var(--alert); }

.empty { color: var(--muted); font-weight: 400 !important; }

/* ---- contato: um toque para ligar --------------------------------- */
.call {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  text-decoration: none;
  color: inherit;
}
.call .num {
  font-size: var(--step-1);
  font-weight: 650;
  white-space: nowrap;
}
.call .go {
  flex: none;
  padding: 0.5rem 0.95rem;
  border-radius: 999px;
  background: var(--calm);
  color: #fff;
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ---- consentimentos ----------------------------------------------- */
.consents {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}
.consent {
  background: var(--paper);
  padding: 0.9rem 1.15rem;
}
.consent h2 {
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.15rem;
}
.consent p { font-size: var(--step-1); font-weight: 700; }
.yes { color: var(--calm); }
.no  { color: var(--alert); }

/* ---- vacinas: colapsadas de propósito ------------------------------ */
/* Vinte e uma linhas de vacina enterrariam a alergia. Um socorrista não
   precisa saber de BCG nos dez primeiros minutos. */
details { border-bottom: 1px solid var(--rule); }
summary {
  padding: 0.95rem 1.15rem;
  cursor: pointer;
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted);
  list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: " ▾"; }
details[open] summary::after { content: " ▴"; }
.vax { padding: 0 1.15rem 1rem; }
.vax li {
  list-style: none;
  padding: 0.3rem 0;
  border-top: 1px solid var(--rule);
  font-size: var(--step-0);
}
.vax li:first-child { border-top: 0; }

/* ---- rodapé -------------------------------------------------------- */
footer {
  padding: 1.15rem;
  color: var(--muted);
  font-size: var(--step--1);
  line-height: 1.5;
}
footer strong { color: var(--ink); }

/* ---- estados ------------------------------------------------------- */
.state {
  padding: 3.5rem 1.4rem;
  text-align: center;
}
.state h1 {
  font-size: var(--step-2);
  font-weight: 700;
  margin-bottom: 0.5rem;
  letter-spacing: -0.015em;
}
.state p {
  color: var(--muted);
  max-width: 26rem;
  margin: 0 auto;
}
.state.err h1 { color: var(--alert); }

.skeleton {
  height: 1em;
  background: var(--rule);
  border-radius: 3px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; }
}

@media (max-width: 26rem) {
  :root { --step-4: 4.25rem; --step-2: 1.625rem; }
  .consents { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="wrap">
  <div class="bar">
    <b>PULLMED</b>
    <span>Registro de emergência</span>
  </div>
  <main id="app">
    <div class="state">
      <div class="skeleton" style="width:60%;margin:0 auto 1rem"></div>
      <div class="skeleton" style="width:40%;margin:0 auto"></div>
    </div>
  </main>
</div>

<script>
const app = document.getElementById('app');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const has = (v) => v !== null && v !== undefined && String(v).trim() !== '';

function state(title, body, isError) {
  app.innerHTML =
    '<div class="state' + (isError ? ' err' : '') + '">' +
      '<h1>' + esc(title) + '</h1>' +
      '<p>' + esc(body) + '</p>' +
    '</div>';
}

/* Um campo vazio nunca é omitido. "Sem informação" e "sem alergia" são
   coisas diferentes, e confundi-las numa emergência é perigoso. */
function field(label, value, critical) {
  const filled = has(value);
  return '<section class="field' + (critical ? ' critical' : '') + '">' +
    '<h2>' + esc(label) + '</h2>' +
    '<p' + (filled ? '' : ' class="empty"') + '>' +
      (filled ? esc(value) : 'Não informado') +
    '</p>' +
  '</section>';
}

function render(r) {
  const vacinas = Array.isArray(r.vacinas) ? r.vacinas : [];

  const atualizado = r.updated_at
    ? new Date(r.updated_at).toLocaleDateString('pt-BR',
        { day: '2-digit', month: 'long', year: 'numeric' })
    : null;

  const tel = has(r.contato_emerg)
    ? String(r.contato_emerg).replace(/[^\d+]/g, '')
    : '';

  app.innerHTML =
    /* A procedência vem antes de qualquer dado. É o único fato sempre
       verdadeiro nesta página. */
    '<div class="provenance">' +
      'Informação inserida pelo próprio paciente. Não verificada por profissional de saúde.' +
    '</div>' +

    '<div class="stub">' +
      '<dl class="blood">' +
        '<dt>Sangue</dt>' +
        '<dd>' + (has(r.sangue) ? esc(r.sangue) : '—') + '</dd>' +
      '</dl>' +
      '<div class="who">' +
        '<h1>' + (has(r.nome) ? esc(r.nome) : 'Sem nome informado') + '</h1>' +
        (has(r.idade) ? '<p>' + esc(r.idade) + ' anos</p>' : '') +
      '</div>' +
    '</div>' +

    /* Ordem de triagem. Os três primeiros mudam conduta nos dez
       primeiros minutos. */
    field('Alergias',              r.alergias,        true) +
    field('Medicações em uso',     r.medicacoes,      true) +
    field('Dispositivos implantados', r.disp_implantado, true) +
    field('Condições preexistentes',  r.doenca_pre,   false) +
    field('Cirurgias',             r.cirurgia,        false) +
    field('Observações',           r.obs_adicional,   false) +

    (has(r.contato_emerg)
      ? '<section class="field">' +
          '<h2>Contato de emergência</h2>' +
          '<a class="call" href="tel:' + esc(tel) + '">' +
            '<span>' +
              '<span class="num">' + esc(r.contato_emerg) + '</span><br>' +
              '<span style="color:var(--muted)">' +
                esc(r.contato_emerg_nome || '') +
                (has(r.contato_emerg_grau) ? ' · ' + esc(r.contato_emerg_grau) : '') +
              '</span>' +
            '</span>' +
            '<span class="go">Ligar</span>' +
          '</a>' +
        '</section>'
      : field('Contato de emergência', null, false)) +

    '<div class="consents">' +
      '<div class="consent">' +
        '<h2>Transfusão</h2>' +
        '<p class="' + (r.transfusao ? 'yes' : 'no') + '">' +
          (r.transfusao ? 'Autorizada' : 'Não autorizada') +
        '</p>' +
      '</div>' +
      '<div class="consent">' +
        '<h2>Doação de órgãos</h2>' +
        '<p class="' + (r.doacao_orgaos ? 'yes' : 'no') + '">' +
          (r.doacao_orgaos ? 'Autorizada' : 'Não autorizada') +
        '</p>' +
      '</div>' +
    '</div>' +

    /* Vacinas colapsadas: 21 linhas enterrariam a alergia. */
    '<details>' +
      '<summary>Vacinação (' + vacinas.length + ')</summary>' +
      '<ul class="vax">' +
        (vacinas.length
          ? vacinas.map(v => '<li>' + esc(v.label) + '</li>').join('')
          : '<li class="empty">Nenhuma vacina registrada.</li>') +
        (has(r.doses_cov)
          ? '<li>COVID-19: ' + esc(r.doses_cov) + ' dose(s)' +
            (has(r.fabricante_cov) ? ' · ' + esc(r.fabricante_cov) : '') + '</li>'
          : '') +
        (has(r.vac_outras) ? '<li>Outras: ' + esc(r.vac_outras) + '</li>' : '') +
      '</ul>' +
    '</details>' +

    '<footer>' +
      (atualizado
        ? 'Atualizado pelo paciente em <strong>' + esc(atualizado) + '</strong>. '
        : '') +
      'Este registro é um auxílio informativo. Não substitui avaliação clínica ' +
      'nem constitui prontuário médico.' +
    '</footer>';
}

async function load() {
  const m = location.pathname.match(/\/r\/([0-9a-f]{32})\/?$/);

  if (!m) {
    state('Endereço inválido',
          'Este link não corresponde a nenhum registro.', true);
    return;
  }

  try {
    const res = await fetch('/api/record?token=' + m[1], { cache: 'no-store' });

    if (res.status === 404) {
      /* Revogado, apagado ou inexistente devolvem a mesma coisa, de
         propósito: distinguir os casos entregaria informação a quem sonda. */
      state('Registro indisponível',
            'Esta pulseira não está ativa. Pode ter sido revogada pelo titular, ' +
            'ou o link pode estar incorreto.', true);
      return;
    }
    if (res.status === 429) {
      state('Muitas tentativas',
            'Aguarde um minuto e tente novamente.', true);
      return;
    }
    if (!res.ok) throw new Error('http ' + res.status);

    render(await res.json());

  } catch (e) {
    /* A falha de rede é a fragilidade central desta arquitetura, e é
       nomeada como tal em vez de virar um "algo deu errado" genérico. */
    state(
      navigator.onLine ? 'Serviço indisponível' : 'Sem conexão',
      navigator.onLine
        ? 'Não foi possível carregar o registro. Tente novamente em instantes.'
        : 'Este registro precisa de internet para ser exibido. Conecte-se e ' +
          'tente novamente.',
      true
    );
  }
}

load();
</script>
</body>
</html>
