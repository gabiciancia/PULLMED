<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULLMED</title>
<style>
  :root { --calm:#14405C; --paper:#FBFBF9; --ink:#14181C; --muted:#5A6975; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--paper); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5;
  }
  main { max-width:30rem; }
  b { display:block; color:var(--calm); font-size:.8125rem; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; margin-bottom:.75rem; }
  h1 { font-size:1.75rem; font-weight:700; letter-spacing:-.015em; margin-bottom:.6rem; }
  p { color:var(--muted); }
  p + p { margin-top:.75rem; font-size:.9375rem; }
  a { color:var(--calm); }
</style>
</head>
<body>
<main>
  <b>PULLMED</b>
  <h1>Pulseira de identificação médica NFC</h1>
  <p>Cada pulseira abre o registro do seu portador. Não há nada para procurar aqui: aproxime um celular com NFC da pulseira e o registro abre sozinho.</p>
  <p>Projeto aberto. Código, CAD e perfis de impressão em <a href="https://github.com/gabiciancia/PULLMED">github.com/gabiciancia/PULLMED</a>.</p>
</main>
</body>
</html>
